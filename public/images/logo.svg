    <circle cx="28" cy="28" r="21" stroke="#ffcc00" stroke-width="2.5" />
    <circle cx="28" cy="28" r="10" fill="#ffcc00" />
    <circle cx="28" cy="28" r="4" fill="#0d0f12" />
    <!-- Spokes / Rotor Vents -->
    <line x1="28" y1="7" x2="28" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="28" y1="38" x2="28" y2="49" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="7" y1="28" x2="18" y2="28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="38" y1="28" x2="49" y2="28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="13.2" y1="13.2" x2="21" y2="21" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" />
    <line x1="35" y1="35" x2="42.8" y2="42.8" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" />
    <line x1="13.2" y1="42.8" x2="21" y2="35" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" />
    <line x1="35" y1="21" x2="42.8" y2="13.2" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" />
  </g>
  <!-- Brand Text -->
  <text x="74" y="36" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" letter-spacing="1">
    <tspan fill="#ffffff">HM AUTO </tspan>
    <tspan fill="#ffcc00">24</tspan>
  </text>
  <text x="76" y="50" fill="#ffcc00" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" letter-spacing="3.2">BERGERAC • MÉCANIQUE</text>
